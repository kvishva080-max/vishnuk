<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(6, 6)">
    <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" stroke="url(#nexusGrad)" stroke-width="2.5" fill="rgba(139,92,246,0.12)" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="4" fill="#22d3ee" filter="url(#glow)"/>
    <line x1="18" y1="2" x2="18" y2="14" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="34" y1="26" x2="22" y2="20" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="2" y1="26" x2="14" y2="20" stroke="#a855f7" stroke-width="1.5"/>
  </g>
  <text x="52" y="31" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-0.03em">Nexus<tspan fill="url(#nexusGrad)">AI</tspan></text>
</svg>